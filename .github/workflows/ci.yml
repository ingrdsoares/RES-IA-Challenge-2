name: CI - Integracao Continua (Socio Digital)

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'docbot/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Qualidade de Codigo (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Ruff
        run: pip install ruff

      - name: Checagem Estatica e Linter (Ruff)
        run: ruff check .

      - name: Validacao de Formatacao (Ruff)
        run: ruff format --check .

  test:
    name: Testes Unitarios e Integracao (Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: sd_test_local
          POSTGRES_DB: sd_test
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sd_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/api/requirements.txt
          pip install -r backend/api/requirements-eval.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Iniciar S3 isolado para testes do MVP
        run: |
          docker run -d --name sd-mvp-test-s3 \
            -e AWS_ACCESS_KEY_ID=sd_test_user \
            -e AWS_SECRET_ACCESS_KEY=sd_test_password \
            -p 127.0.0.1:19000:8333 chrislusf/seaweedfs:4.53 mini -dir=/data
          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://localhost:19000; then exit 0; fi
            sleep 1
          done
          docker logs sd-mvp-test-s3
          exit 1

      - name: Executar Pytest
        env:
          PYTHONPATH: backend/api:.
        run: pytest

      - name: Executar Testes Fiscais/RAG (se presentes no branch)
        env:
          PYTHONPATH: backend/api:.
        run: |
          if [ -f test_fiscal.py ]; then python test_fiscal.py; fi
          if [ -f test_entity_extractor.py ]; then python test_entity_extractor.py; fi
          if [ -f test_rag_service.py ]; then python test_rag_service.py; fi

  rag-quality-gate:
    name: RAG Quality Gate & Benchmark (MLOps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/api/requirements.txt
          pip install mlflow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ingestao do Acervo e Bases Fiscais
        run: |
          python test_fiscal.py
          python test_pipeline.py

      - name: Executar Testes de Regras e Servico RAG
        run: |
          python test_entity_extractor.py
          python test_rag_service.py

      - name: Executar Benchmark de Governanca RAG (MLOps)
        run: |
          python benchmark_rag.py

      - name: Verificar Limites de Regressao de Qualidade
        run: |
          python scripts/check_rag_regression.py

      - name: Registrar Metricas no MLflow
        run: |
          python scripts/log_mlflow_benchmark.py
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlruns.db

      - name: Arquivar Relatorio de Benchmark (JSON)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-benchmark-results
          path: data/benchmark/benchmark_results.json

  dvc-validation:
    name: Validacao de Dados e DVC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar DVC
        run: pip install dvc

      - name: Checagem de Integridade do DVC
        run: |
          dvc doctor
          dvc status

  docker-smoke-test:
    name: Validacao da Imagem Docker (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da Imagem Docker
        run: docker build -t socio-digital-api:ci -f backend/api/Dockerfile backend/api/

  frontend-ci:
    name: Frontend - Qualidade, Testes e Build (React/Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependencias
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Checagem de Tipos e Linter
        working-directory: frontend
        run: npm run lint

      - name: Executar Testes Unitarios
        working-directory: frontend
        run: npm test

      - name: Build de Producao do Frontend
        working-directory: frontend
        run: npm run build

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validacao do Build da Imagem Docker do Frontend
        run: docker build -t socio-digital-frontend:ci -f frontend/Dockerfile frontend/
