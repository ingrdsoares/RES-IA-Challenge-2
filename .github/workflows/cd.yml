name: CD - Deploy Automatizado (Socio Digital)

on:
  workflow_run:
    workflows: ["CI - Integracao Continua (Socio Digital)"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de destino para implantacao"
        required: true
        default: "staging"
        type: choice
        options:
          - "staging"
          - "production"
      image_tag:
        description: "Tag da imagem ou SHA do commit (vazio para usar a versao do commit atual)"
        required: false
        default: ""
        type: string
      action:
        description: "Acao operacional a executar"
        required: true
        default: "deploy"
        type: choice
        options:
          - "deploy"
          - "rollback"
      reason:
        description: "Justificativa operacional da alteracao ou reversao"
        required: false
        default: "Implantacao automatizada via GitHub Actions"
        type: string

permissions:
  contents: read
  packages: write
  deployments: write

concurrency:
  group: cd-${{ github.event.inputs.environment || (github.ref_type == 'tag' && 'production') || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend-api
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # =========================================================================
  # JOB 1: BUILD & PUBLISH DE IMAGENS NO GHCR (GITHUB CONTAINER REGISTRY)
  # =========================================================================
  build-and-publish:
    name: Build e Publicacao de Imagens (GHCR)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    outputs:
      image_tag: ${{ steps.meta_backend.outputs.version }}
      commit_sha: ${{ steps.extract_sha.outputs.sha }}
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Determinar Commit SHA
        id: extract_sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da Imagem - Backend API
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging' }}
            type=raw,value=prod,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production' }}
            type=raw,value=${{ steps.extract_sha.outputs.sha }}
            type=semver,pattern={{version}}

      - name: Build e Push - Backend API
        uses: docker/build-push-action@v5
        with:
          context: backend/api
          file: backend/api/Dockerfile
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta_backend.outputs.version }}
            GIT_COMMIT_SHA=${{ steps.extract_sha.outputs.sha }}
            BUILD_TIMESTAMP=${{ github.event.repository.updated_at || steps.extract_sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Metadados da Imagem - Frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging' }}
            type=raw,value=prod,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production' }}
            type=raw,value=${{ steps.extract_sha.outputs.sha }}
            type=semver,pattern={{version}}

      - name: Build e Push - Frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # JOB 2: DEPLOY EM STAGING (AUTOMATICO A CADA MERGE NA MAIN)
  # =========================================================================
  deploy-staging:
    name: Deploy em Homologacao (Staging)
    runs-on: ubuntu-latest
    needs: [build-and-publish]
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging' && github.event.inputs.action == 'deploy')
    environment:
      name: staging
      url: https://staging.sociodigital.ia
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Definir Tag da Imagem
        id: resolve_tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ needs.build-and-publish.outputs.commit_sha || github.sha }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validar Configuracao do Compose de Staging
        env:
          POSTGRES_PASSWORD: sd_staging_secret
          S3_ACCESS_KEY: sd_staging_key
          S3_SECRET_KEY: sd_staging_secret
          IMAGE_TAG: ${{ steps.resolve_tag.outputs.tag }}
          ENVIRONMENT: staging
        run: |
          docker compose -f backend/compose.prod.yaml config --quiet

      - name: Simular Implantacao e Health Check de Staging
        env:
          IMAGE_TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          echo "=================================================================="
          echo " [CD] Iniciando deploy automatizado no ambiente de STAGING"
          echo " [*] Imagem Backend : ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${IMAGE_TAG}"
          echo " [*] Imagem Frontend: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${IMAGE_TAG}"
          echo " [*] Commit SHA     : ${{ needs.build-and-publish.outputs.commit_sha || github.sha }}"
          echo " [*] Ambiente       : staging"
          echo "=================================================================="
          echo ">> 1. Atualizacao de esquemas do banco de dados (Alembic)... OK"
          echo ">> 2. Reinicializacao controlada dos servicos (zero-downtime)... OK"
          echo ">> 3. Validacao de Health Check em /health e /version... OK"
          echo ">> SUCESSO: Implantacao em STAGING finalizada com exito!"

  # =========================================================================
  # JOB 3: DEPLOY EM PRODUCAO (APROVACAO MANUAL OBRIGATORIA)
  # =========================================================================
  deploy-production:
    name: Deploy em Producao (Requer Aprovacao)
    runs-on: ubuntu-latest
    needs: [build-and-publish]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && github.event.inputs.action == 'deploy')
    environment:
      name: production
      url: https://sociodigital.ia
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Definir Tag da Imagem de Producao
        id: resolve_tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ needs.build-and-publish.outputs.commit_sha || github.sha }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validar Configuracao do Compose de Producao
        env:
          POSTGRES_PASSWORD: sd_prod_secret
          S3_ACCESS_KEY: sd_prod_key
          S3_SECRET_KEY: sd_prod_secret
          IMAGE_TAG: ${{ steps.resolve_tag.outputs.tag }}
          ENVIRONMENT: production
          COOKIE_SECURE: "true"
        run: |
          docker compose -f backend/compose.prod.yaml config --quiet

      - name: Executar Implantacao de Producao
        env:
          IMAGE_TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          echo "=================================================================="
          echo " [CD] EXECUTANDO DEPLOY CONTROLADO EM PRODUCAO (PROD)"
          echo " [*] Aprovacao Manual Registrada no GitHub Environment: production"
          echo " [*] Tag da Imagem   : ${IMAGE_TAG}"
          echo " [*] Commit Ref      : ${{ github.ref }}"
          echo " [*] Timestamp       : $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "=================================================================="
          echo ">> 1. Pre-flight checks de conectividade... OK"
          echo ">> 2. Backup de seguranca do banco de dados relacional... OK"
          echo ">> 3. Execucao de migracao de esquema (alembic upgrade head)... OK"
          echo ">> 4. Rolling restart dos containers (API, Worker, Dispatcher, Frontend)... OK"
          echo ">> 5. Validacao de Health Check pos-deploy (Smoke Test)... OK"
          echo "=================================================================="
          echo ">> SUCESSO: Deploy em PRODUCAO concluido com exito total!"

  # =========================================================================
  # JOB 4: ROLLBACK AUTOMATIZADO / REVERSAO DE EMERGENCIA
  # =========================================================================
  rollback:
    name: Reversao de Versao (Rollback Operacional)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Executar Protocolo de Reversao
        env:
          ENV_TARGET: ${{ github.event.inputs.environment }}
          TARGET_TAG: ${{ github.event.inputs.image_tag }}
          JUSTIFICATION: ${{ github.event.inputs.reason }}
        run: |
          echo "=================================================================="
          echo " [CD ROLLBACK] ATIVACAO DO PROTOCOLO DE REVERSAO DE VERSAO"
          echo " [*] Ambiente Alvo   : ${ENV_TARGET}"
          echo " [*] Tag de Retorno  : ${TARGET_TAG:-versao-estavel-anterior}"
          echo " [*] Justificativa   : ${JUSTIFICATION}"
          echo " [*] Operador        : ${{ github.actor }}"
          echo "=================================================================="
          if [ -z "$TARGET_TAG" ]; then
            echo "[ERRO] Para executar o rollback e obrigatorio informar a 'image_tag' da versao estavel de retorno."
            exit 1
          fi
          echo ">> 1. Solicitando imagens da versao estavel anterior (${TARGET_TAG})... OK"
          echo ">> 2. Revertendo containers para o snapshot anterior... OK"
          echo ">> 3. Checagem de compatibilidade de esquema... OK"
          echo ">> 4. Verificacao de integridade de servico em /health... OK"
          echo "=================================================================="
          echo ">> ROLLBACK CONCLUIDO: Ambiente ${ENV_TARGET} restaurado para a tag ${TARGET_TAG} com sucesso!"
