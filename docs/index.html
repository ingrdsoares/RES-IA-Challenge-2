<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Socio Digital: Copiloto de Gestao Fiscal | Grupo 08</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Socio Digital: Copiloto de Gestao Fiscal para Pequenos Negocios - Residencia em IA (RES-IA) - Grupo 08">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #2563eb;
      --sidebar-width: 280px;
    }
    .app-name-link {
      font-weight: 700;
      font-size: 1.1rem;
    }
    .badge {
      display: inline-block;
      padding: 0.25em 0.5em;
      font-size: 0.85em;
      font-weight: 600;
      border-radius: 4px;
    }
    table {
      display: table !important;
      width: 100%;
    }
    th, td {
      text-align: left;
      padding: 10px 14px;
    }
    .mermaid {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div id="app">Carregando documentação...</div>
  <script>
    window.$docsify = {
      name: 'Socio Digital (Grupo 08)',
      repo: 'https://github.com/ingrdsoares/RES-IA-Challenge-2',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      requestHeaders: {
        'Cache-Control': 'no-cache'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Buscar na documentação...',
        noData: 'Nenhum resultado encontrado.',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Erro',
        successText: 'Copiado!'
      },
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === 'mermaid') {
              var texto = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
              return '<div class="mermaid">' + texto + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            if (window.mermaid) {
              window.mermaid.run({ querySelector: '.mermaid' });
            }
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false });</script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy Code Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Zoom Image Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
